openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: Applications
    description: Application pipeline operations.
  - name: PendingChanges
    description: Write-back queue of pending changes for Mac sync.
  - name: Today
    description: Today view aggregated data.
  - name: Queue
    description: Discovery queue triage.
  - name: Analytics
    description: Funnel, score-band, response-rate, and velocity analytics.
  - name: Calendar
    description: Season deadline calendar operations.
  - name: Settings
    description: App settings (weekly target, fallback ingest upload).
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the OIDC authorization endpoint.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        "302":
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenExchangeRequest"
      responses:
        "200":
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenExchangeSuccess"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Invalidate a mobile session token
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
      responses:
        "200":
          description: Session deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"
  /applications:
    get:
      operationId: listApplications
      tags: [Applications]
      summary: List applications with optional filters and sorting
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: score_band
          in: query
          required: false
          schema:
            type: string
            enum: [unscored, low, mid, high]
        - name: company
          in: query
          required: false
          schema:
            type: string
        - name: sort_col
          in: query
          required: false
          schema:
            type: string
            enum: [date, company, role, score, status, days_in_stage]
            default: date
        - name: sort_dir
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Paginated applications list with computed fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationListResponse"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /applications/{num}:
    get:
      operationId: getApplicationDetail
      tags: [Applications]
      summary: Get full application detail with status history and eval
      parameters:
        - name: num
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Application with status events and eval summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDetail"
        "404":
          description: Application not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /pending-changes:
    get:
      operationId: listPendingChanges
      tags: [PendingChanges]
      summary: List pending changes, optionally filtered by state or num
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [pending, copied, applied, dismissed]
        - name: num
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of pending changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingChangesListResponse"
    post:
      operationId: createPendingChange
      tags: [PendingChanges]
      summary: Create a new pending change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePendingChangeRequest"
      responses:
        "201":
          description: Pending change created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingChangeEnvelope"
        "422":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /pending-changes/{id}:
    patch:
      operationId: updatePendingChangeState
      tags: [PendingChanges]
      summary: Update the state of a pending change
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePendingChangeStateRequest"
      responses:
        "200":
          description: Updated pending change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingChangeEnvelope"
        "404":
          description: Not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /queue:
    get:
      operationId: listQueueItems
      tags: [Queue]
      summary: List discovery queue items with optional filter and pagination
      parameters:
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum: [unreviewed, all]
            default: unreviewed
        - name: company
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [rank, score]
            default: score
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Paginated queue items sorted by rank or score.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueListResponse"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /queue/{id}/reviewed:
    patch:
      operationId: setQueueItemReviewed
      tags: [Queue]
      summary: Set the reviewed flag on a queue item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetQueueItemReviewedRequest"
      responses:
        "200":
          description: Updated queue item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueItemEnvelope"
        "404":
          description: Queue item not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /analytics:
    get:
      operationId: getAnalytics
      tags: [Analytics]
      summary: Funnel, score-band, response-rate, and velocity analytics
      responses:
        "200":
          description: Analytics data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsResponse"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /today:
    get:
      operationId: getTodayView
      tags: [Today]
      summary: Today view — follow-ups, suggestions, queue top, blockers, weekly goal, season alert
      responses:
        "200":
          description: Today view data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayResponse"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /deadlines:
    get:
      operationId: listDeadlines
      tags: [Calendar]
      summary: List all season deadlines
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: List of deadlines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeadlineListResponse"
    post:
      operationId: createDeadline
      tags: [Calendar]
      summary: Create a season deadline
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSeasonDeadlineRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeadlineEnvelope"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /deadlines/csv-import:
    post:
      operationId: importDeadlinesCsv
      tags: [Calendar]
      summary: Bulk import deadlines from CSV
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CsvImportRequest"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvImportResult"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /deadlines/{id}:
    patch:
      operationId: updateDeadline
      tags: [Calendar]
      summary: Update a season deadline
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSeasonDeadlineRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeadlineEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteDeadline
      tags: [Calendar]
      summary: Delete a season deadline
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /settings:
    get:
      operationId: getSettings
      tags: [Settings]
      summary: Get application settings
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
    put:
      operationId: updateSettings
      tags: [Settings]
      summary: Update application settings
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /settings/ingest:
    post:
      operationId: submitFallbackIngest
      tags: [Settings]
      summary: Fallback ingest upload (session auth)
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FallbackIngestPayload"
      responses:
        "200":
          description: Ingest complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestUploadResult"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: "Bearer <session-token> for mobile clients."
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Session cookie for browser clients.
      schema:
        type: string
  schemas:
    FunnelStage:
      type: object
      required: [stage, count, in_flight, conversion_pct]
      properties:
        stage:
          type: string
        count:
          type: integer
        in_flight:
          type: integer
        conversion_pct:
          oneOf:
            - type: number
            - type: "null"
    ScoreBandRow:
      type: object
      required: [band, n, in_flight_n, terminal_positive_n, terminal_negative_n]
      properties:
        band:
          type: string
          enum: [high, mid, low, unscored]
        n:
          type: integer
        in_flight_n:
          type: integer
        terminal_positive_n:
          type: integer
        terminal_negative_n:
          type: integer
    ResponseRateSplit:
      type: object
      required: [label, n_applied, n_responded, rate_pct]
      properties:
        label:
          type: string
        n_applied:
          type: integer
        n_responded:
          type: integer
        rate_pct:
          oneOf:
            - type: number
            - type: "null"
    ResponseRates:
      type: object
      required: [by_letter_tone, by_resume]
      properties:
        by_letter_tone:
          type: array
          items:
            $ref: "#/components/schemas/ResponseRateSplit"
        by_resume:
          type: array
          items:
            $ref: "#/components/schemas/ResponseRateSplit"
    VelocityHop:
      type: object
      required: [from_stage, to_stage, n, median_days]
      properties:
        from_stage:
          type: string
        to_stage:
          type: string
        n:
          type: integer
        median_days:
          oneOf:
            - type: number
            - type: "null"
    AnalyticsResponse:
      type: object
      required: [total_apps, funnel, score_bands, response_rates, velocity]
      properties:
        total_apps:
          type: integer
        funnel:
          type: array
          items:
            $ref: "#/components/schemas/FunnelStage"
        score_bands:
          type: array
          items:
            $ref: "#/components/schemas/ScoreBandRow"
        response_rates:
          $ref: "#/components/schemas/ResponseRates"
        velocity:
          type: array
          items:
            $ref: "#/components/schemas/VelocityHop"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthUser:
      type: object
      required: [id]
      properties:
        id:
          type: string
        email:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        profileImageUrl:
          type: ["string", "null"]
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    # ── Calendar ─────────────────────────────────────────────────────────────
    SeasonDeadline:
      type: object
      required: [id, company, program, url, notes, source]
      properties:
        id:
          type: integer
        company:
          type: string
        program:
          type: string
        opens_date:
          oneOf:
            - type: string
            - type: "null"
        closes_date:
          oneOf:
            - type: string
            - type: "null"
        url:
          type: string
        notes:
          type: string
        source:
          type: string
          enum: [manual, import]
    DeadlineListResponse:
      type: object
      required: [deadlines]
      properties:
        deadlines:
          type: array
          items:
            $ref: "#/components/schemas/SeasonDeadline"
    DeadlineEnvelope:
      type: object
      required: [deadline]
      properties:
        deadline:
          $ref: "#/components/schemas/SeasonDeadline"
    CreateSeasonDeadlineRequest:
      type: object
      required: [company]
      properties:
        company:
          type: string
          minLength: 1
        program:
          type: string
        opens_date:
          oneOf:
            - type: string
            - type: "null"
        closes_date:
          oneOf:
            - type: string
            - type: "null"
        url:
          type: string
        notes:
          type: string
    UpdateSeasonDeadlineRequest:
      type: object
      properties:
        company:
          type: string
          minLength: 1
        program:
          type: string
        opens_date:
          oneOf:
            - type: string
            - type: "null"
        closes_date:
          oneOf:
            - type: string
            - type: "null"
        url:
          type: string
        notes:
          type: string
    CsvImportRequest:
      type: object
      required: [csv]
      properties:
        csv:
          type: string
          description: Raw CSV text. Header row required with at minimum a "company" column.
    CsvImportResult:
      type: object
      required: [inserted, errors]
      properties:
        inserted:
          type: integer
        errors:
          type: array
          items:
            type: string
    # ── Settings ─────────────────────────────────────────────────────────────
    AppSettings:
      type: object
      required: [weekly_target]
      properties:
        weekly_target:
          type: integer
          minimum: 1
          maximum: 1000
    UpdateSettingsRequest:
      type: object
      required: [weekly_target]
      properties:
        weekly_target:
          type: integer
          minimum: 1
          maximum: 1000
    FallbackIngestPayload:
      type: object
      description: Raw ingest payload — same schema as POST /ingest but sent with session auth.
      additionalProperties: true
    IngestUploadResult:
      type: object
      required: [ok, payload_version, counts]
      properties:
        ok:
          type: boolean
        payload_version:
          type: integer
        counts:
          type: object
          additionalProperties:
            type: integer
    # ── Applications ─────────────────────────────────────────────────────────
    ApplicationRow:
      type: object
      required:
        - num
        - date
        - company
        - role
        - score
        - status
        - contact
        - via
        - resume
        - letter
        - report
        - notes
        - days_in_stage
        - has_ghost_flag
        - resume_present
        - letter_present
      properties:
        num:
          type: integer
        date:
          type: string
        company:
          type: string
        role:
          type: string
        score:
          type: string
        status:
          type: string
        contact:
          type: string
        via:
          type: string
        resume:
          type: string
        letter:
          type: string
        report:
          type: string
        notes:
          type: string
        days_in_stage:
          type: integer
          description: Days since last status change (LA timezone). 0 if same day.
        has_ghost_flag:
          type: boolean
          description: True if status=applied and no status event in 21 days.
        resume_present:
          type: boolean
        letter_present:
          type: boolean
    ApplicationListResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationRow"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        last_sync_at:
          type: ["string", "null"]
          description: ISO-8601 timestamp of the last successful ingest, or null.
    StatusEventRow:
      type: object
      required: [id, num, date, from_status, to_status, source, note]
      properties:
        id:
          type: integer
        num:
          type: integer
        date:
          type: string
        from_status:
          type: string
        to_status:
          type: string
        source:
          type: string
        note:
          type: string
    EvalSummaryRow:
      type: object
      required: [num, url, company, role, score, recommendation, legitimacy, blockers, warnings]
      properties:
        num:
          type: integer
        url:
          type: string
        company:
          type: string
        role:
          type: string
        score:
          type: string
        recommendation:
          type: string
        legitimacy:
          type: string
        blockers:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
    ApplicationDetail:
      type: object
      required: [application, status_events]
      properties:
        application:
          $ref: "#/components/schemas/ApplicationRow"
        status_events:
          type: array
          items:
            $ref: "#/components/schemas/StatusEventRow"
        eval:
          oneOf:
            - $ref: "#/components/schemas/EvalSummaryRow"
            - type: "null"
    # ── PendingChanges ────────────────────────────────────────────────────────
    PendingChange:
      type: object
      required: [id, createdAt, num, kind, payload, command, state]
      properties:
        id:
          type: integer
        createdAt:
          type: string
          description: ISO-8601 UTC timestamp.
        num:
          type: integer
        kind:
          type: string
          enum: [status, note, contact, followup_done]
        payload:
          type: object
          description: Kind-specific payload (target_status, note, target_contact, reason).
          additionalProperties: true
        command:
          type: string
          description: Exact CLI command to run on the Mac.
        state:
          type: string
          enum: [pending, copied, applied, dismissed]
    PendingChangesListResponse:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/PendingChange"
    PendingChangeEnvelope:
      type: object
      required: [change]
      properties:
        change:
          $ref: "#/components/schemas/PendingChange"
    CreatePendingChangeRequest:
      type: object
      required: [num, kind, payload, command]
      properties:
        num:
          type: integer
        kind:
          type: string
          enum: [status, note, contact, followup_done]
        payload:
          type: object
          additionalProperties: true
        command:
          type: string
          minLength: 1
    UpdatePendingChangeStateRequest:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [copied, applied, dismissed]
    # ── Queue ─────────────────────────────────────────────────────────────────
    QueueItemRow:
      type: object
      required: [id, rank, score, company, title, posted, url, reviewed, posted_age_days]
      properties:
        id:
          type: integer
        rank:
          type: integer
        score:
          type: [number, "null"]
          description: Application score, or null when no score data is available.
        company:
          type: string
        title:
          type: string
        posted:
          type: string
          description: YYYY-MM-DD posting date.
        url:
          type: string
        reviewed:
          type: boolean
        posted_age_days:
          type: integer
          description: Days since posted date.
    QueueListResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QueueItemRow"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    SetQueueItemReviewedRequest:
      type: object
      required: [reviewed]
      properties:
        reviewed:
          type: boolean
    QueueItemEnvelope:
      type: object
      required: [item]
      properties:
        item:
          $ref: "#/components/schemas/QueueItemRow"
    # ── Today ─────────────────────────────────────────────────────────────────
    TodayFollowup:
      type: object
      required: [id, num, company, role, urgency_label, next_date, reason]
      properties:
        id:
          type: integer
        num:
          type: integer
        company:
          type: string
        role:
          type: string
        urgency_label:
          type: string
          enum: [urgent, overdue, needs-data, waiting, cold]
        next_date:
          type: string
        reason:
          type: string
    TodayReplySuggestion:
      type: object
      required: [id, message_date, subject, from_addr, kind, confidence, suggested_command]
      properties:
        id:
          type: integer
        message_date:
          type: string
        subject:
          type: string
        from_addr:
          type: string
        kind:
          type: string
        confidence:
          type: string
        suggested_command:
          type: string
    TodayQueueItem:
      type: object
      required: [id, company, title, score, posted, posted_age_days]
      properties:
        id:
          type: integer
        company:
          type: string
        title:
          type: string
        score:
          type: [number, "null"]
          description: Application score, or null when no score data is available.
        posted:
          type: string
        posted_age_days:
          type: integer
    TodayBlocker:
      type: object
      required: [num, company, status, blockers]
      properties:
        num:
          type: integer
        company:
          type: string
        status:
          type: string
        blockers:
          type: array
          items:
            type: string
    WeeklyGoal:
      type: object
      required: [target, progress, week_start]
      properties:
        target:
          type: integer
        progress:
          type: integer
        week_start:
          type: string
    SeasonAlert:
      type: object
      required: [id, company, program, kind, date]
      properties:
        id:
          type: integer
        company:
          type: string
        program:
          type: string
        kind:
          type: string
          enum: [opens, closes]
        date:
          type: string
    TodayResponse:
      type: object
      required: [today_date, last_sync_at, is_stale, followups, reply_suggestions, queue_top, blockers, weekly_goal]
      properties:
        today_date:
          type: string
        last_sync_at:
          type: ["string", "null"]
        is_stale:
          type: boolean
        followups:
          type: array
          items:
            $ref: "#/components/schemas/TodayFollowup"
        reply_suggestions:
          type: array
          items:
            $ref: "#/components/schemas/TodayReplySuggestion"
        queue_top:
          type: array
          items:
            $ref: "#/components/schemas/TodayQueueItem"
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/TodayBlocker"
        weekly_goal:
          $ref: "#/components/schemas/WeeklyGoal"
        season_alert:
          oneOf:
            - $ref: "#/components/schemas/SeasonAlert"
            - type: "null"
