openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: Applications
    description: Application pipeline operations.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the returnTo path on success.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        "302":
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenExchangeRequest"
      responses:
        "200":
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenExchangeSuccess"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Invalidate a mobile session token
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
      responses:
        "200":
          description: Session deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"
  /applications:
    get:
      operationId: listApplications
      tags: [Applications]
      summary: List applications with optional filters and sorting
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: score_band
          in: query
          required: false
          schema:
            type: string
            enum: [unscored, low, mid, high]
        - name: company
          in: query
          required: false
          schema:
            type: string
        - name: sort_col
          in: query
          required: false
          schema:
            type: string
            enum: [date, company, role, score, status, days_in_stage]
            default: date
        - name: sort_dir
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Paginated applications list with computed fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationListResponse"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /applications/{num}:
    get:
      operationId: getApplicationDetail
      tags: [Applications]
      summary: Get full application detail with status history and eval
      parameters:
        - name: num
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Application with status events and eval summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDetail"
        "404":
          description: Application not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: "Bearer <session-token> for mobile clients."
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Session cookie for browser clients.
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthUser:
      type: object
      required: [id]
      properties:
        id:
          type: string
        email:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        profileImageUrl:
          type: ["string", "null"]
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    # ── Applications ───────────────────────────────────────────────────────────
    ApplicationRow:
      type: object
      required:
        - num
        - date
        - company
        - role
        - score
        - status
        - contact
        - via
        - resume
        - letter
        - report
        - notes
        - days_in_stage
        - has_ghost_flag
        - resume_present
        - letter_present
      properties:
        num:
          type: integer
        date:
          type: string
        company:
          type: string
        role:
          type: string
        score:
          type: string
        status:
          type: string
        contact:
          type: string
        via:
          type: string
        resume:
          type: string
        letter:
          type: string
        report:
          type: string
        notes:
          type: string
        days_in_stage:
          type: integer
          description: Days since last status change (LA timezone). 0 if same day.
        has_ghost_flag:
          type: boolean
          description: True if status=applied and no status event in 21 days.
        resume_present:
          type: boolean
        letter_present:
          type: boolean
    ApplicationListResponse:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationRow"
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        last_sync_at:
          type: ["string", "null"]
          description: ISO-8601 timestamp of the last successful ingest, or null.
    StatusEventRow:
      type: object
      required: [id, num, date, from_status, to_status, source, note]
      properties:
        id:
          type: integer
        num:
          type: integer
        date:
          type: string
        from_status:
          type: string
        to_status:
          type: string
        source:
          type: string
        note:
          type: string
    EvalSummaryRow:
      type: object
      required: [num, url, company, role, score, recommendation, legitimacy, blockers, warnings]
      properties:
        num:
          type: integer
        url:
          type: string
        company:
          type: string
        role:
          type: string
        score:
          type: string
        recommendation:
          type: string
        legitimacy:
          type: string
        blockers:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
    ApplicationDetail:
      type: object
      required: [application, status_events]
      properties:
        application:
          $ref: "#/components/schemas/ApplicationRow"
        status_events:
          type: array
          items:
            $ref: "#/components/schemas/StatusEventRow"
        eval:
          oneOf:
            - $ref: "#/components/schemas/EvalSummaryRow"
            - type: "null"
